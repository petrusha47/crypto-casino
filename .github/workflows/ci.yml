name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: casino
          POSTGRES_PASSWORD: casino
          POSTGRES_DB: casino_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: casino-backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: casino-backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://casino:casino@localhost:5432/casino_test

      - run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://casino:casino@localhost:5432/casino_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-32chars-minimum
          JWT_REFRESH_SECRET: test-refresh-secret-32chars-minimum
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          CORS_ORIGIN: http://localhost:3000

  typecheck-frontend:
    name: Frontend TypeCheck
    runs-on: ubuntu-latest
    if: ${{ hashFiles('casino-frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: casino-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: casino-frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
